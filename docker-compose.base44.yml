# Development environment for the Flashforge AD5X product site.
# Runs the app straight from the cloned source with live reload:
#   web  — Vite dev server (host port 3000)
#   api  — Express content/lead API (host port 8000)
#   db   — PostgreSQL for editable content, leads and admin sessions
name: ad5x

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ad5x
      POSTGRES_PASSWORD: ad5x_local_dev
      POSTGRES_DB: ad5x
    volumes:
      - ad5x_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ad5x -d ad5x']
      interval: 5s
      timeout: 5s
      retries: 24
    restart: on-failure

  api:
    image: node:22-alpine
    working_dir: /workspace/server
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --prefer-offline && exec node --watch src/index.mjs
    environment:
      - NODE_ENV=development
      - PORT=8000
      # Local infrastructure credentials, generated here (not user secrets).
      - DATABASE_URL=postgres://ad5x:ad5x_local_dev@db:5432/ad5x
      - DEFAULT_CONTENT_PATH=/workspace/src/content/default-content.json
      # Bare pass-through so the exact "1" check works inside the container.
      - BASE44_PREVIEW_MODE
    env_file:
      # Platform-managed secrets (ADMIN_USERNAME / ADMIN_PASSWORD). Always last.
      - /run/base44/app.env
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - ad5x_api_modules:/workspace/server/node_modules
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8000/api/health || exit 1']
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 50s
    restart: on-failure

  web:
    image: node:22-alpine
    working_dir: /workspace
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund --prefer-offline && exec npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - API_PROXY_TARGET=http://api:8000
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - ad5x_web_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_started
    ports:
      - '3000:5173'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 4s
      retries: 18
      start_period: 40s
    restart: on-failure

volumes:
  ad5x_db:
  ad5x_api_modules:
  ad5x_web_modules:
